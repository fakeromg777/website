<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>折彎機刀具步驟圖</title>
  <style>
    :root {
      --bg: #f3f6f8;
      --panel: #ffffff;
      --text: #14212b;
      --muted: #647280;
      --line: #d7e0e6;
      --blue: #2f6fd6;
      --knife: #d00000;
      --node: #f00018;
      --active: #ffb000;
      --ok: #147c59;
      --bad: #b42318;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    main {
      width: min(1200px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 40px;
    }

    header {
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(28px, 4vw, 42px);
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .layout {
      display: grid;
      grid-template-columns: 390px 1fr;
      gap: 14px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 16px 36px rgba(31, 48, 60, .08);
      overflow: hidden;
    }

    h2 {
      margin: 0;
      padding: 14px 16px;
      font-size: 20px;
      border-bottom: 1px solid var(--line);
      background: #f9fbfc;
    }

    .controls {
      padding: 14px 16px 16px;
      display: grid;
      gap: 12px;
    }

    label {
      display: grid;
      gap: 6px;
      font-weight: 800;
    }

    input, select, button {
      font: inherit;
    }

    input, select {
      width: 100%;
      min-height: 40px;
      padding: 7px 9px;
      border: 1px solid #cbd6dc;
      border-radius: 8px;
      background: #fff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: #fbfcfd;
    }

    th, td {
      padding: 7px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    th {
      color: var(--muted);
      font-size: 13px;
      background: #f5f7f8;
    }

    th:first-child, td:first-child {
      width: 46px;
      text-align: center;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    button {
      min-height: 40px;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 8px 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .primary {
      color: #fff;
      background: #176b87;
    }

    .secondary {
      color: #176b87;
      background: #eef7fa;
      border-color: #c9e1ea;
    }

    .remove {
      width: 32px;
      min-height: 32px;
      padding: 0;
      color: var(--bad);
      background: #fff;
      border-color: var(--line);
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 14px 16px 0;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      background: #fbfcfd;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 4px;
    }

    .metric strong {
      font-size: 22px;
    }

    svg {
      width: 100%;
      display: block;
      background: #fff;
    }

    #finalSvg {
      min-height: 420px;
      margin-top: 12px;
      border-top: 1px solid var(--line);
      background:
        linear-gradient(#eef3f6 1px, transparent 1px),
        linear-gradient(90deg, #eef3f6 1px, transparent 1px),
        #fff;
      background-size: 24px 24px;
    }

    .steps {
      margin-top: 14px;
    }

    .cards {
      padding: 14px 16px 16px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
    }

    .card h3 {
      margin: 0;
      padding: 10px 12px;
      font-size: 15px;
      background: #f7f9fa;
      border-bottom: 1px solid var(--line);
    }

    .ok { fill: var(--ok); color: var(--ok); font-weight: 900; }
    .bad { fill: var(--bad); color: var(--bad); font-weight: 900; }

    @media (max-width: 900px) {
      .layout, .cards, .summary {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>折彎機刀具步驟圖</h1>
      <p>輸入段長與折角後，圖形會照順序累積折彎。第 2 步會保留第 1 步，第 3 步會保留前兩步，並顯示彎刀線與是否卡刀。</p>
    </header>

    <section class="layout">
      <div class="panel">
        <h2>輸入資料</h2>
        <div class="controls">
          <label>
            板厚 mm
            <input id="thickness" type="number" min="0.1" step="0.1" value="2">
          </label>
          <table>
            <thead>
              <tr>
                <th>段</th>
                <th>段長</th>
                <th>折角</th>
                <th>折彎</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
          <div class="buttons">
            <button class="primary" id="drawBtn" type="button">產生圖形</button>
            <button class="secondary" id="addBtn" type="button">新增段次</button>
            <button class="secondary" id="sampleBtn" type="button">套用範例</button>
          </div>
        </div>
      </div>

      <div class="panel">
        <h2>折彎完成圖</h2>
        <div class="summary">
          <div class="metric"><span>總長</span><strong id="total">0</strong></div>
          <div class="metric"><span>折彎數</span><strong id="bendCount">0</strong></div>
          <div class="metric"><span>建議最短邊</span><strong id="minEdge">0</strong></div>
        </div>
        <svg id="finalSvg" viewBox="0 0 720 420"></svg>
      </div>
    </section>

    <section class="steps panel">
      <h2>彎刀步驟與卡刀判斷</h2>
      <div class="cards" id="cards"></div>
    </section>
  </main>

  <script>
    const rows = document.querySelector("#rows");
    const cards = document.querySelector("#cards");
    const finalSvg = document.querySelector("#finalSvg");
    const thickness = document.querySelector("#thickness");

    const sample = [
      { length: 30, angle: 0, bend: false },
      { length: 35, angle: 90, bend: true },
      { length: 45, angle: -90, bend: true },
      { length: 30, angle: 90, bend: true }
    ];

    const tools = [
      { code: "D01", type: "直刀", v: 12, tMin: 1, tMax: 2, minFlange: 15, height: 100, throat: 0 },
      { code: "D02", type: "直刀", v: 18, tMin: 2, tMax: 3, minFlange: 20, height: 110, throat: 0 },
      { code: "G01", type: "彎刀", v: 18, tMin: 2, tMax: 3, minFlange: 8, height: 120, throat: 30 },
      { code: "G02", type: "彎刀", v: 24, tMin: 3, tMax: 5, minFlange: 10, height: 130, throat: 40 }
    ];

    function n(value) {
      const parsed = Number(value);
      return Number.isFinite(parsed) ? parsed : 0;
    }

    function normalize(angle) {
      let value = angle % 360;
      if (value < 0) value += 360;
      return value;
    }

    function addRow(data = { length: 30, angle: 0, bend: false }) {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td class="no"></td>
        <td><input class="len" type="number" min="0" step="1" value="${data.length}"></td>
        <td><input class="ang" type="number" step="1" value="${data.angle}"></td>
        <td>
          <select class="bend">
            <option value="yes"${data.bend ? " selected" : ""}>是</option>
            <option value="no"${data.bend ? "" : " selected"}>否</option>
          </select>
        </td>
        <td><button class="remove" type="button" title="刪除">×</button></td>
      `;
      tr.querySelector(".remove").addEventListener("click", () => {
        tr.remove();
        renumber();
        draw();
      });
      tr.querySelectorAll("input,select").forEach(el => el.addEventListener("input", draw));
      rows.appendChild(tr);
      renumber();
    }

    function renumber() {
      [...rows.querySelectorAll("tr")].forEach((tr, i) => {
        tr.querySelector(".no").textContent = i + 1;
      });
    }

    function getSegments() {
      return [...rows.querySelectorAll("tr")]
        .map(tr => ({
          length: Math.max(0, n(tr.querySelector(".len").value)),
          angle: n(tr.querySelector(".ang").value),
          bend: tr.querySelector(".bend").value === "yes"
        }))
        .filter(seg => seg.length > 0);
    }

    function absoluteAnglesFor(segments, folded) {
      let angle = 0;
      const angles = [];
      segments.forEach((seg, index) => {
        if (index > 0 && folded.has(index)) {
          angle = normalize(angle + seg.angle);
        }
        angles.push(angle);
      });
      return angles;
    }

    function pointsFor(segments, folded) {
      let x = 0;
      let y = 0;
      const points = [{ x, y }];
      const angles = absoluteAnglesFor(segments, folded);

      segments.forEach((seg, index) => {
        const rad = angles[index] * Math.PI / 180;
        x += seg.length * Math.cos(rad);
        y += seg.length * Math.sin(rad);
        points.push({ x, y });
      });

      return points;
    }

    function toolAngleByCurrentSegment(currAng, bendAngle) {
      const prevAng = normalize(currAng - bendAngle);
      const prevOutAng = normalize(prevAng + 180);
      const nextOutAng = normalize(currAng);
      const r1 = prevOutAng * Math.PI / 180;
      const r2 = nextOutAng * Math.PI / 180;
      const vx = Math.cos(r1) + Math.cos(r2);
      const vy = Math.sin(r1) + Math.sin(r2);
      if (Math.abs(vx) < 0.000001 && Math.abs(vy) < 0.000001) {
        return normalize(prevAng + 90);
      }
      return normalize(Math.atan2(vy, vx) * 180 / Math.PI);
    }

    function rotatePoint(x, y, angleDeg) {
      const rad = angleDeg * Math.PI / 180;
      return {
        x: x * Math.cos(rad) - y * Math.sin(rad),
        y: x * Math.sin(rad) + y * Math.cos(rad)
      };
    }

    function transformPlateToFixedTool(points, bendPoint, toolAngle, needsFlip = false) {
      const rotateAngle = needsFlip ? normalize(270 - normalize(360 - toolAngle)) : normalize(270 - toolAngle);
      return points.map(point => {
        const localY = needsFlip ? -(point.y - bendPoint.y) : point.y - bendPoint.y;
        return rotatePoint(point.x - bendPoint.x, localY, rotateAngle);
      });
    }

    function fit(points, width, height, margin, anchorIndex = null, anchorX = null, anchorY = null) {
      const minX = Math.min(...points.map(p => p.x));
      const maxX = Math.max(...points.map(p => p.x));
      const minY = Math.min(...points.map(p => p.y));
      const maxY = Math.max(...points.map(p => p.y));
      const scale = Math.min((width - margin * 2) / Math.max(1, maxX - minX), (height - margin * 2) / Math.max(1, maxY - minY));

      if (anchorIndex !== null) {
        const anchor = points[anchorIndex];
        return points.map(p => ({
          x: anchorX + (p.x - anchor.x) * scale,
          y: anchorY - (p.y - anchor.y) * scale
        }));
      }

      return points.map(p => ({
        x: margin + (p.x - minX) * scale,
        y: height - margin - (p.y - minY) * scale
      }));
    }

    function poly(points) {
      return points.map(p => `${p.x},${p.y}`).join(" ");
    }

    function segmentHitsTool(a, b, toolX, top, bottom) {
      if (Math.abs(b.x - a.x) < 0.001) {
        if (Math.abs(a.x - toolX) > 8) return false;
        return Math.max(Math.min(a.y, b.y), top) <= Math.min(Math.max(a.y, b.y), bottom);
      }
      const t = (toolX - a.x) / (b.x - a.x);
      if (t <= 0.04 || t >= 0.96) return false;
      const y = a.y + (b.y - a.y) * t;
      return y >= top && y <= bottom;
    }

    function direction(a, b, c) {
      return (c.x - a.x) * (b.y - a.y) - (c.y - a.y) * (b.x - a.x);
    }

    function pointOnSegment(a, b, p) {
      return Math.abs(direction(a, b, p)) <= 0.000001
        && p.x >= Math.min(a.x, b.x) - 0.000001
        && p.x <= Math.max(a.x, b.x) + 0.000001
        && p.y >= Math.min(a.y, b.y) - 0.000001
        && p.y <= Math.max(a.y, b.y) + 0.000001;
    }

    function linesIntersect(a, b, c, d, inclusive = false) {
      const d1 = direction(c, d, a);
      const d2 = direction(c, d, b);
      const d3 = direction(a, b, c);
      const d4 = direction(a, b, d);
      if (((d1 > 0 && d2 < 0) || (d1 < 0 && d2 > 0)) && ((d3 > 0 && d4 < 0) || (d3 < 0 && d4 > 0))) return true;
      if (!inclusive) return false;
      return (Math.abs(d1) <= 0.000001 && pointOnSegment(c, d, a))
        || (Math.abs(d2) <= 0.000001 && pointOnSegment(c, d, b))
        || (Math.abs(d3) <= 0.000001 && pointOnSegment(a, b, c))
        || (Math.abs(d4) <= 0.000001 && pointOnSegment(a, b, d));
    }

    function samePoint(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y) < 0.000001;
    }

    function toolSegmentHitsPlateSegment(a, b, c, d, bend) {
      if (!linesIntersect(a, b, c, d, true)) return false;
      const plateHasBend = pointOnSegment(a, b, bend);
      const toolHasBend = pointOnSegment(c, d, bend);
      if (plateHasBend && toolHasBend) {
        const plateOtherOnTool = (!samePoint(a, bend) && pointOnSegment(c, d, a)) || (!samePoint(b, bend) && pointOnSegment(c, d, b));
        const toolOtherOnPlate = (!samePoint(c, bend) && pointOnSegment(a, b, c)) || (!samePoint(d, bend) && pointOnSegment(a, b, d));
        if (!plateOtherOnTool && !toolOtherOnPlate) return false;
      }
      return true;
    }

    function checkPlateSelfIntersection(points) {
      for (let i = 1; i < points.length - 1; i += 1) {
        for (let j = i + 2; j < points.length; j += 1) {
          if (i === 1 && j === points.length - 1) continue;
          if (linesIntersect(points[i - 1], points[i], points[j - 1], points[j])) return true;
        }
      }
      return false;
    }

    function checkToolActionLineHit(points, toolHeight) {
      const bend = { x: 0, y: 0 };
      const toolEnd = { x: 0, y: -(toolHeight + 10000) };
      return points.some((point, index) => index > 0 && toolSegmentHitsPlateSegment(points[index - 1], point, bend, toolEnd, bend));
    }

    function goosePoints(tool, throatSide = 1) {
      const height = tool.height || 100;
      const throat = tool.throat || 30;
      const tipBack = Math.max(height * 0.14, 14);
      const tipOffset = Math.min(Math.max(throat * 0.18, 8), height * 0.22);
      const lowerBody = Math.max(height * 0.44, 38);
      const shoulderBack = Math.min(Math.max(height * 0.18, 16), height * 0.26);
      const shoulderOffset = Math.min(Math.max(throat * 0.34, 18), height * 0.38);
      const upperBody = Math.max(height * 0.42, 38);
      const ux = 0;
      const uy = -1;
      const sx = 1 * throatSide;
      const sy = 0;
      const p1 = { x: 0, y: 0 };
      const p2 = { x: p1.x + ux * tipBack - sx * tipOffset, y: p1.y + uy * tipBack - sy * tipOffset };
      const p3 = { x: p2.x + ux * lowerBody, y: p2.y + uy * lowerBody };
      const p4 = { x: p3.x + ux * shoulderBack + sx * shoulderOffset, y: p3.y + uy * shoulderBack + sy * shoulderOffset };
      const p5 = { x: p4.x + ux * upperBody, y: p4.y + uy * upperBody };
      const p6 = { x: p5.x, y: p5.y - 10000 };
      return [p1, p2, p3, p4, p5, p6];
    }

    function checkGooseToolBodyHit(points, tool, throatSide = 1) {
      const bend = { x: 0, y: 0 };
      const gp = goosePoints(tool, throatSide);
      for (let i = 1; i < points.length; i += 1) {
        for (let j = 1; j < gp.length; j += 1) {
          if (toolSegmentHitsPlateSegment(points[i - 1], points[i], gp[j - 1], gp[j], bend)) return true;
        }
      }
      return false;
    }

    function countFolded(folded) {
      return folded.size;
    }

    function stepToolEdge(segments, activeIndex, foldNo) {
      const rightLen = segments[activeIndex]?.length || 0;
      const leftLen = activeIndex > 0 ? segments[activeIndex - 1].length : 0;
      if (foldNo <= 1 && rightLen > 0) return rightLen;
      if (leftLen <= 0) return rightLen;
      if (rightLen <= 0) return leftLen;
      return Math.min(leftLen, rightLen);
    }

    function angleDiff(a1, a2) {
      let diff = Math.abs(normalize(a1) - normalize(a2));
      if (diff > 180) diff = 360 - diff;
      return diff;
    }

    function isInnerByAngles(absAngles, bendCount) {
      if (bendCount < 3) return false;
      for (let i = 2; i < absAngles.length; i += 1) {
        if (angleDiff(absAngles[i], absAngles[i - 2]) > 140) return true;
      }
      return false;
    }

    function partHeight(points) {
      return Math.abs(Math.max(...points.map(p => p.y)) - Math.min(...points.map(p => p.y)));
    }

    function riskText(thick, minEdge, isInner) {
      if (minEdge === 0) return "資料不足";
      if (minEdge < thick * 2.5) return "高";
      if (isInner && minEdge < thick * 4) return "中";
      if (minEdge < thick * 4) return "中";
      return "低";
    }

    function bestToolByType(thick, minEdge, height, targetType) {
      let best = null;
      let bestScore = Infinity;
      tools.forEach(tool => {
        if (tool.type !== targetType) return;
        if (thick < tool.tMin || thick > tool.tMax) return;
        if (targetType !== "直刀" && minEdge < tool.minFlange) return;
        if (targetType === "彎刀" && (tool.throat <= 0 || minEdge > tool.throat)) return;
        let score = Math.abs(((tool.tMin + tool.tMax) / 2) - thick) * 10 + Math.abs(tool.minFlange - minEdge) * 0.5 + tool.v * 0.1;
        if (targetType === "直刀" && minEdge < tool.minFlange) score += (tool.minFlange - minEdge) * 2;
        if (targetType === "彎刀") score -= tool.throat * 0.5;
        if (score < bestScore) {
          best = tool;
          bestScore = score;
        }
      });
      return best;
    }

    function evaluateStep(segments, folded, activeIndex, thick, excelSequentialFoldNo = null) {
      const absAngles = absoluteAnglesFor(segments, folded);
      const raw = pointsFor(segments, folded);
      const foldNo = countFolded(folded);
      const minEdge = stepToolEdge(segments, activeIndex, excelSequentialFoldNo ?? foldNo);
      const inner = isInnerByAngles(absAngles, foldNo);
      const risk = riskText(thick, minEdge, inner);

      if (checkPlateSelfIntersection(raw)) {
        return { ok: false, minEdge, risk: "高", tool: null, toolType: "不可", result: "不可製作：板件自交/封閉", needsFlip: false, throatSide: 1, raw, absAngles };
      }

      const bendPoint = raw[activeIndex];
      const toolAngle = toolAngleByCurrentSegment(absAngles[activeIndex], segments[activeIndex].angle);
      const machine = transformPlateToFixedTool(raw, bendPoint, toolAngle, false);
      const flipMachine = transformPlateToFixedTool(raw, bendPoint, toolAngle, true);
      const straight = bestToolByType(thick, minEdge, partHeight(raw), "直刀");
      const goose = bestToolByType(thick, minEdge, partHeight(raw), "彎刀");

      if (straight) {
        const straightOK = !checkToolActionLineHit(machine, straight.height);
        const straightFlipOK = !checkToolActionLineHit(flipMachine, straight.height);
        if (straightOK) return { ok: true, minEdge, risk: "低", tool: straight, toolType: "直刀", result: "可製作", needsFlip: false, throatSide: 1, raw, absAngles };
        if (straightFlipOK) return { ok: true, minEdge, risk: "中", tool: straight, toolType: "直刀", result: "可製作：需翻面", needsFlip: true, throatSide: 1, raw, absAngles };
      }

      if (goose) {
        if (!checkGooseToolBodyHit(machine, goose, 1)) return { ok: true, minEdge, risk: "中", tool: goose, toolType: "彎刀", result: "可試作", needsFlip: false, throatSide: 1, raw, absAngles };
        if (!checkGooseToolBodyHit(machine, goose, -1)) return { ok: true, minEdge, risk: "中", tool: goose, toolType: "彎刀", result: "可製作：反向彎刀", needsFlip: false, throatSide: -1, raw, absAngles };
        if (!checkGooseToolBodyHit(flipMachine, goose, -1)) return { ok: true, minEdge, risk: "中", tool: goose, toolType: "彎刀", result: "可製作：需翻面", needsFlip: true, throatSide: -1, raw, absAngles };
        if (!checkGooseToolBodyHit(flipMachine, goose, 1)) return { ok: true, minEdge, risk: "中", tool: goose, toolType: "彎刀", result: "可製作：需翻面/反向彎刀", needsFlip: true, throatSide: 1, raw, absAngles };
      }

      if (!straight && !goose) return { ok: false, minEdge, risk: "高", tool: null, toolType: "無", result: "無可用刀具", needsFlip: false, throatSide: 1, raw, absAngles };
      return { ok: false, minEdge, risk: "高", tool: null, toolType: "不可", result: "不可製作：卡刀", needsFlip: false, throatSide: 1, raw, absAngles };
    }

    function bendNoForIndex(bendIndexes, bendIndex) {
      return bendIndexes.findIndex(item => item.i === bendIndex) + 1;
    }

    function evaluateOrder(segments, order, thick) {
      const folded = new Set();
      return order.map((bendIndex, stepIndex) => {
        folded.add(bendIndex);
        return {
          bendIndex,
          folded: new Set(folded),
          evalInfo: evaluateStep(segments, folded, bendIndex, thick, stepIndex)
        };
      });
    }

    function findSuggestedOrder(segments, bendIndexes, thick) {
      if (bendIndexes.length <= 1 || bendIndexes.length > 8) return null;
      const candidates = bendIndexes.map(item => item.i);
      const used = new Set();
      const folded = new Set();
      const order = [];

      function search(depth) {
        if (depth === candidates.length) return true;
        for (const bendIndex of candidates) {
          if (used.has(bendIndex)) continue;
          used.add(bendIndex);
          folded.add(bendIndex);
          const evalInfo = evaluateStep(segments, folded, bendIndex, thick, depth);
          if (evalInfo.ok) {
            order.push(bendIndex);
            if (search(depth + 1)) return true;
            order.pop();
          }
          folded.delete(bendIndex);
          used.delete(bendIndex);
        }
        return false;
      }

      return search(0) ? [...order] : null;
    }

    function machineViewport(points, width, height, bendX, bendY, minToolHeight = 84, extraToolPoints = []) {
      const allPoints = [...points, ...extraToolPoints];
      let minX = Math.min(...allPoints.map(p => p.x));
      let maxX = Math.max(...allPoints.map(p => p.x));
      let minY = Math.min(...allPoints.map(p => p.y));
      let maxY = Math.max(...allPoints.map(p => p.y));
      const margin = 18;
      minY = Math.min(minY, -minToolHeight);

      const maxLeft = Math.abs(Math.min(0, minX));
      const maxRight = Math.abs(Math.max(0, maxX));
      const maxUp = Math.abs(Math.min(0, minY));
      const maxDown = Math.abs(Math.max(0, maxY));
      const scales = [];
      if (maxLeft > 0) scales.push((bendX - margin) / maxLeft);
      if (maxRight > 0) scales.push((width - margin - bendX) / maxRight);
      if (maxUp > 0) scales.push((bendY - margin - 38) / maxUp);
      if (maxDown > 0) scales.push((height - margin - bendY) / maxDown);
      const scale = Math.max(0.1, Math.min(...scales.filter(value => Number.isFinite(value) && value > 0)));

      const toScreen = point => ({ x: bendX + point.x * scale, y: bendY + point.y * scale });
      return { points: points.map(toScreen), toScreen, scale };
    }

    function fitMachine(points, width, height, bendX, bendY, minToolHeight = 84) {
      return machineViewport(points, width, height, bendX, bendY, minToolHeight).points;
    }

    function cardSvg(step, bendNo, bendIndex, segments, folded, evalInfo) {
      const width = 520;
      const height = 300;
      const toolX = 260;
      const bendY = 210;
      const toolTop = 46;
      const toolBottom = bendY - 6;
      const absAngles = absoluteAnglesFor(segments, folded);
      const raw = pointsFor(segments, folded);
      const bendPoint = raw[bendIndex];
      const toolAngle = toolAngleByCurrentSegment(absAngles[bendIndex], segments[bendIndex].angle);
      const machine = transformPlateToFixedTool(raw, bendPoint, toolAngle, evalInfo.needsFlip);
      const tool = evalInfo.tool || { code: "-", type: "直刀", height: 100, throat: 0 };
      const goose = tool.type === "彎刀" ? goosePoints(tool, evalInfo.throatSide) : [];
      const view = machineViewport(machine, width, height, toolX, bendY, tool.height * 1.05, goose.slice(0, 5));
      const pts = view.points;
      const ok = evalInfo.ok;
      const labels = segments.map((seg, i) => {
        const a = pts[i];
        const b = pts[i + 1];
        return `<text x="${(a.x + b.x) / 2 + 8}" y="${(a.y + b.y) / 2 - 8}" font-size="13" font-weight="900">${seg.length}</text>`;
      }).join("");
      const nodes = pts.map((p, i) => {
        const active = i === bendIndex;
        return `<circle cx="${p.x}" cy="${p.y}" r="${active ? 7 : 5}" fill="${active ? "var(--active)" : "var(--node)"}" stroke="var(--node)" stroke-width="${active ? 2 : 0}"></circle>`;
      }).join("");

      return `
        <svg viewBox="0 0 ${width} ${height}">
          <rect x="0" y="0" width="${width}" height="${height}" fill="#fff"></rect>
          <text x="18" y="32" font-size="18" font-weight="900">步驟 ${step}：第${bendNo}折　${tool.type} / ${tool.code}</text>
          <text x="18" y="66" font-size="15" fill="#647280">短邊 ${evalInfo.minEdge} mm｜<tspan class="${ok ? "ok" : "bad"}">${evalInfo.result}</tspan></text>
          <text x="${toolX + 16}" y="60" font-size="14" font-weight="900" fill="var(--knife)">T100${step}</text>
          ${tool.type === "彎刀"
            ? goose.slice(1, 5).map((p, i) => {
              const a = view.toScreen(goose[i]);
              const b = view.toScreen(p);
              return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="var(--knife)" stroke-width="2" stroke-dasharray="8 6"></line>`;
            }).join("") + `<line x1="${view.toScreen(goose[4]).x}" y1="${view.toScreen(goose[4]).y}" x2="${view.toScreen({ x: goose[4].x, y: -160 }).x}" y2="${toolTop}" stroke="var(--knife)" stroke-width="2" stroke-dasharray="8 6"></line>`
            : `<line x1="${toolX}" y1="${toolTop}" x2="${toolX}" y2="${toolBottom}" stroke="var(--knife)" stroke-width="2" stroke-dasharray="8 6"></line>`}
          <polyline points="${poly(pts)}" fill="none" stroke="var(--blue)" stroke-width="4"></polyline>
          ${labels}
          ${nodes}
          ${!ok ? `<circle cx="${toolX}" cy="${bendY - 48}" r="8" fill="var(--bad)"></circle><text x="${toolX + 13}" y="${bendY - 43}" font-size="14" font-weight="900" fill="var(--bad)">卡刀</text>` : ""}
        </svg>
      `;
    }

    function drawFinal(segments, folded) {
      const points = fit(pointsFor(segments, folded), 720, 420, 52);
      finalSvg.innerHTML = `
        <polyline points="${poly(points)}" fill="none" stroke="#176b87" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"></polyline>
        ${points.map((p, i) => `<circle cx="${p.x}" cy="${p.y}" r="6" fill="${i === 0 ? "#147c59" : "#fff"}" stroke="#176b87" stroke-width="3"></circle>`).join("")}
        ${segments.map((seg, i) => {
          const a = points[i];
          const b = points[i + 1];
          return `<text x="${(a.x + b.x) / 2}" y="${(a.y + b.y) / 2 - 12}" text-anchor="middle" font-size="15" font-weight="900">${seg.length}mm</text>`;
        }).join("")}
      `;
    }

    function draw() {
      const segments = getSegments();
      const bendIndexes = segments.map((seg, i) => ({ seg, i })).filter(item => item.i > 0 && (item.seg.bend || item.seg.angle !== 0));
      const allFolded = new Set(bendIndexes.map(item => item.i));
      const minEdgeValue = Math.max(8, n(thickness.value) * 6);
      const total = segments.reduce((sum, seg) => sum + seg.length, 0);
      const thick = n(thickness.value);

      document.querySelector("#total").textContent = `${total} mm`;
      document.querySelector("#bendCount").textContent = bendIndexes.length;
      document.querySelector("#minEdge").textContent = `${minEdgeValue} mm`;
      drawFinal(segments, allFolded);

      cards.innerHTML = "";
      const originalOrder = bendIndexes.map(item => item.i);
      let stepData = evaluateOrder(segments, originalOrder, thick);
      const hasCannotMake = stepData.some(item => !item.evalInfo.ok);
      const suggestedOrder = hasCannotMake ? findSuggestedOrder(segments, bendIndexes, thick) : null;
      if (suggestedOrder) {
        stepData = evaluateOrder(segments, suggestedOrder, thick);
      }

      if (suggestedOrder) {
        const notice = document.createElement("div");
        notice.style.gridColumn = "1 / -1";
        notice.style.padding = "10px 12px";
        notice.style.border = "1px solid #c9e1ea";
        notice.style.borderRadius = "8px";
        notice.style.background = "#eef7fa";
        notice.style.color = "#176b87";
        notice.style.fontWeight = "900";
        notice.textContent = `原順序會卡刀，已依 Excel 邏輯改用建議順序：${suggestedOrder.map(index => bendNoForIndex(bendIndexes, index)).join("→")}`;
        cards.appendChild(notice);
      }

      stepData.forEach((item, i) => {
        const bendNo = bendNoForIndex(bendIndexes, item.bendIndex);
        const article = document.createElement("article");
        article.className = "card";
        article.innerHTML = `<h3>第 ${i + 1} 折刀具步驟圖</h3>${cardSvg(i + 1, bendNo, item.bendIndex, segments, item.folded, item.evalInfo)}`;
        cards.appendChild(article);
      });
    }

    function loadSample() {
      rows.innerHTML = "";
      sample.forEach(addRow);
      draw();
    }

    document.querySelector("#drawBtn").addEventListener("click", draw);
    document.querySelector("#addBtn").addEventListener("click", () => {
      addRow();
      draw();
    });
    document.querySelector("#sampleBtn").addEventListener("click", loadSample);
    thickness.addEventListener("input", draw);

    loadSample();
  </script>
</body>
</html>
