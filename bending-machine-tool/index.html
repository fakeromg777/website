<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>折彎機刀具步驟圖</title>
  <style>
    :root {
      --bg: #f3f6f8;
      --panel: #ffffff;
      --text: #14212b;
      --muted: #647280;
      --line: #d7e0e6;
      --blue: #2f6fd6;
      --knife: #d00000;
      --node: #f00018;
      --active: #ffb000;
      --ok: #147c59;
      --bad: #b42318;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    main {
      width: min(1200px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 40px;
    }

    header {
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(28px, 4vw, 42px);
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .layout {
      display: grid;
      grid-template-columns: 390px 1fr;
      gap: 14px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 16px 36px rgba(31, 48, 60, .08);
      overflow: hidden;
    }

    h2 {
      margin: 0;
      padding: 14px 16px;
      font-size: 20px;
      border-bottom: 1px solid var(--line);
      background: #f9fbfc;
    }

    .controls {
      padding: 14px 16px 16px;
      display: grid;
      gap: 12px;
    }

    label {
      display: grid;
      gap: 6px;
      font-weight: 800;
    }

    input, select, button {
      font: inherit;
    }

    input, select {
      width: 100%;
      min-height: 40px;
      padding: 7px 9px;
      border: 1px solid #cbd6dc;
      border-radius: 8px;
      background: #fff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: #fbfcfd;
    }

    th, td {
      padding: 7px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    th {
      color: var(--muted);
      font-size: 13px;
      background: #f5f7f8;
    }

    th:first-child, td:first-child {
      width: 46px;
      text-align: center;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    button {
      min-height: 40px;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 8px 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .primary {
      color: #fff;
      background: #176b87;
    }

    .secondary {
      color: #176b87;
      background: #eef7fa;
      border-color: #c9e1ea;
    }

    .remove {
      width: 32px;
      min-height: 32px;
      padding: 0;
      color: var(--bad);
      background: #fff;
      border-color: var(--line);
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 14px 16px 0;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      background: #fbfcfd;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 4px;
    }

    .metric strong {
      font-size: 22px;
    }

    svg {
      width: 100%;
      display: block;
      background: #fff;
    }

    #finalSvg {
      min-height: 420px;
      margin-top: 12px;
      border-top: 1px solid var(--line);
      background:
        linear-gradient(#eef3f6 1px, transparent 1px),
        linear-gradient(90deg, #eef3f6 1px, transparent 1px),
        #fff;
      background-size: 24px 24px;
    }

    .steps {
      margin-top: 14px;
    }

    .cards {
      padding: 14px 16px 16px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
    }

    .card h3 {
      margin: 0;
      padding: 10px 12px;
      font-size: 15px;
      background: #f7f9fa;
      border-bottom: 1px solid var(--line);
    }

    .ok { fill: var(--ok); color: var(--ok); font-weight: 900; }
    .bad { fill: var(--bad); color: var(--bad); font-weight: 900; }

    @media (max-width: 900px) {
      .layout, .cards, .summary {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>折彎機刀具步驟圖</h1>
      <p>輸入段長與折角後，圖形會照順序累積折彎。第 2 步會保留第 1 步，第 3 步會保留前兩步，並顯示彎刀線與是否卡刀。</p>
    </header>

    <section class="layout">
      <div class="panel">
        <h2>輸入資料</h2>
        <div class="controls">
          <label>
            板厚 mm
            <input id="thickness" type="number" min="0.1" step="0.1" value="2">
          </label>
          <table>
            <thead>
              <tr>
                <th>段</th>
                <th>段長</th>
                <th>折角</th>
                <th>折彎</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
          <div class="buttons">
            <button class="primary" id="drawBtn" type="button">產生圖形</button>
            <button class="secondary" id="addBtn" type="button">新增段次</button>
            <button class="secondary" id="sampleBtn" type="button">套用範例</button>
          </div>
        </div>
      </div>

      <div class="panel">
        <h2>折彎完成圖</h2>
        <div class="summary">
          <div class="metric"><span>總長</span><strong id="total">0</strong></div>
          <div class="metric"><span>折彎數</span><strong id="bendCount">0</strong></div>
          <div class="metric"><span>建議最短邊</span><strong id="minEdge">0</strong></div>
        </div>
        <svg id="finalSvg" viewBox="0 0 720 420"></svg>
      </div>
    </section>

    <section class="steps panel">
      <h2>彎刀步驟與卡刀判斷</h2>
      <div class="cards" id="cards"></div>
    </section>
  </main>

  <script>
    const rows = document.querySelector("#rows");
    const cards = document.querySelector("#cards");
    const finalSvg = document.querySelector("#finalSvg");
    const thickness = document.querySelector("#thickness");

    const sample = [
      { length: 30, angle: 0, bend: false },
      { length: 35, angle: 90, bend: true },
      { length: 45, angle: -90, bend: true },
      { length: 30, angle: 90, bend: true }
    ];

    function n(value) {
      const parsed = Number(value);
      return Number.isFinite(parsed) ? parsed : 0;
    }

    function normalize(angle) {
      let value = angle % 360;
      if (value < 0) value += 360;
      return value;
    }

    function addRow(data = { length: 30, angle: 0, bend: false }) {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td class="no"></td>
        <td><input class="len" type="number" min="0" step="1" value="${data.length}"></td>
        <td><input class="ang" type="number" step="1" value="${data.angle}"></td>
        <td>
          <select class="bend">
            <option value="yes"${data.bend ? " selected" : ""}>是</option>
            <option value="no"${data.bend ? "" : " selected"}>否</option>
          </select>
        </td>
        <td><button class="remove" type="button" title="刪除">×</button></td>
      `;
      tr.querySelector(".remove").addEventListener("click", () => {
        tr.remove();
        renumber();
        draw();
      });
      tr.querySelectorAll("input,select").forEach(el => el.addEventListener("input", draw));
      rows.appendChild(tr);
      renumber();
    }

    function renumber() {
      [...rows.querySelectorAll("tr")].forEach((tr, i) => {
        tr.querySelector(".no").textContent = i + 1;
      });
    }

    function getSegments() {
      return [...rows.querySelectorAll("tr")]
        .map(tr => ({
          length: Math.max(0, n(tr.querySelector(".len").value)),
          angle: n(tr.querySelector(".ang").value),
          bend: tr.querySelector(".bend").value === "yes"
        }))
        .filter(seg => seg.length > 0);
    }

    function pointsFor(segments, folded) {
      let angle = 0;
      let x = 0;
      let y = 0;
      const points = [{ x, y }];

      segments.forEach((seg, index) => {
        if (index > 0 && folded.has(index)) {
          angle = normalize(angle + seg.angle);
        }
        const rad = angle * Math.PI / 180;
        x += seg.length * Math.cos(rad);
        y += seg.length * Math.sin(rad);
        points.push({ x, y });
      });

      return points;
    }

    function fit(points, width, height, margin, anchorIndex = null, anchorX = null, anchorY = null) {
      const minX = Math.min(...points.map(p => p.x));
      const maxX = Math.max(...points.map(p => p.x));
      const minY = Math.min(...points.map(p => p.y));
      const maxY = Math.max(...points.map(p => p.y));
      const scale = Math.min((width - margin * 2) / Math.max(1, maxX - minX), (height - margin * 2) / Math.max(1, maxY - minY));

      if (anchorIndex !== null) {
        const anchor = points[anchorIndex];
        return points.map(p => ({
          x: anchorX + (p.x - anchor.x) * scale,
          y: anchorY - (p.y - anchor.y) * scale
        }));
      }

      return points.map(p => ({
        x: margin + (p.x - minX) * scale,
        y: height - margin - (p.y - minY) * scale
      }));
    }

    function poly(points) {
      return points.map(p => `${p.x},${p.y}`).join(" ");
    }

    function segmentHitsTool(a, b, toolX, top, bottom) {
      if (Math.abs(b.x - a.x) < 0.001) {
        if (Math.abs(a.x - toolX) > 8) return false;
        return Math.max(Math.min(a.y, b.y), top) <= Math.min(Math.max(a.y, b.y), bottom);
      }
      const t = (toolX - a.x) / (b.x - a.x);
      if (t <= 0.04 || t >= 0.96) return false;
      const y = a.y + (b.y - a.y) * t;
      return y >= top && y <= bottom;
    }

    function cardSvg(step, bendIndex, segments, folded, shortEdge, minEdge) {
      const width = 520;
      const height = 330;
      const toolX = 330;
      const bendY = 220;
      const toolTop = 46;
      const toolBottom = bendY - 6;
      const raw = pointsFor(segments, folded);
      const pts = fit(raw, width, height, 42, bendIndex, toolX, bendY);
      const hit = pts.some((p, i) => {
        if (i === 0 || i === bendIndex || i === bendIndex + 1) return false;
        return segmentHitsTool(pts[i - 1], p, toolX, toolTop, toolBottom);
      });
      const ok = !hit && shortEdge >= minEdge;
      const labels = segments.map((seg, i) => {
        const a = pts[i];
        const b = pts[i + 1];
        return `<text x="${(a.x + b.x) / 2 + 8}" y="${(a.y + b.y) / 2 - 8}" font-size="13" font-weight="900">${seg.length}</text>`;
      }).join("");
      const nodes = pts.map((p, i) => {
        const active = i === bendIndex;
        return `<circle cx="${p.x}" cy="${p.y}" r="${active ? 7 : 5}" fill="${active ? "var(--active)" : "var(--node)"}" stroke="var(--node)" stroke-width="${active ? 2 : 0}"></circle>`;
      }).join("");

      return `
        <svg viewBox="0 0 ${width} ${height}">
          <rect x="0" y="0" width="${width}" height="${height}" fill="#fff"></rect>
          <text x="18" y="32" font-size="18" font-weight="900">步驟 ${step}：第${step}折　彎刀 / D02</text>
          <text x="18" y="66" font-size="15" fill="#647280">短邊 ${shortEdge} mm｜<tspan class="${ok ? "ok" : "bad"}">${ok ? "不卡刀" : "卡刀或短邊不足"}</tspan></text>
          <text x="${toolX + 16}" y="60" font-size="14" font-weight="900" fill="var(--knife)">T100${step}</text>
          <line x1="${toolX}" y1="${toolTop}" x2="${toolX}" y2="${toolBottom}" stroke="var(--knife)" stroke-width="2" stroke-dasharray="8 6"></line>
          <polyline points="${poly(pts)}" fill="none" stroke="var(--blue)" stroke-width="4"></polyline>
          ${labels}
          ${nodes}
          ${hit ? `<circle cx="${toolX}" cy="${bendY - 48}" r="8" fill="var(--bad)"></circle><text x="${toolX + 13}" y="${bendY - 43}" font-size="14" font-weight="900" fill="var(--bad)">卡刀</text>` : ""}
        </svg>
      `;
    }

    function drawFinal(segments, folded) {
      const points = fit(pointsFor(segments, folded), 720, 420, 52);
      finalSvg.innerHTML = `
        <polyline points="${poly(points)}" fill="none" stroke="#176b87" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"></polyline>
        ${points.map((p, i) => `<circle cx="${p.x}" cy="${p.y}" r="6" fill="${i === 0 ? "#147c59" : "#fff"}" stroke="#176b87" stroke-width="3"></circle>`).join("")}
        ${segments.map((seg, i) => {
          const a = points[i];
          const b = points[i + 1];
          return `<text x="${(a.x + b.x) / 2}" y="${(a.y + b.y) / 2 - 12}" text-anchor="middle" font-size="15" font-weight="900">${seg.length}mm</text>`;
        }).join("")}
      `;
    }

    function draw() {
      const segments = getSegments();
      const bendIndexes = segments.map((seg, i) => ({ seg, i })).filter(item => item.i > 0 && (item.seg.bend || item.seg.angle !== 0));
      const allFolded = new Set(bendIndexes.map(item => item.i));
      const minEdgeValue = Math.max(8, n(thickness.value) * 6);
      const total = segments.reduce((sum, seg) => sum + seg.length, 0);

      document.querySelector("#total").textContent = `${total} mm`;
      document.querySelector("#bendCount").textContent = bendIndexes.length;
      document.querySelector("#minEdge").textContent = `${minEdgeValue} mm`;
      drawFinal(segments, allFolded);

      cards.innerHTML = "";
      const folded = new Set();
      bendIndexes.forEach((item, i) => {
        folded.add(item.i);
        const shortEdge = Math.min(segments[item.i - 1]?.length || 0, segments[item.i]?.length || 0);
        const article = document.createElement("article");
        article.className = "card";
        article.innerHTML = `<h3>第 ${i + 1} 折刀具步驟圖</h3>${cardSvg(i + 1, item.i, segments, folded, shortEdge, minEdgeValue)}`;
        cards.appendChild(article);
      });
    }

    function loadSample() {
      rows.innerHTML = "";
      sample.forEach(addRow);
      draw();
    }

    document.querySelector("#drawBtn").addEventListener("click", draw);
    document.querySelector("#addBtn").addEventListener("click", () => {
      addRow();
      draw();
    });
    document.querySelector("#sampleBtn").addEventListener("click", loadSample);
    thickness.addEventListener("input", draw);

    loadSample();
  </script>
</body>
</html>
