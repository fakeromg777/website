<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>折彎機圖形與步驟產生器</title>
<style>
:root{--bg:#f4f6f7;--panel:#fff;--text:#172026;--muted:#64717a;--line:#d8e0e5;--accent:#176b87;--accent2:#1f8a70;--warn:#a35d00;--bad:#b42318;--shadow:0 18px 44px rgba(23,39,48,.11)}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font-family:"Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;background:linear-gradient(135deg,rgba(23,107,135,.13),transparent 34%),linear-gradient(315deg,rgba(31,138,112,.12),transparent 32%),var(--bg)}main{width:min(1220px,calc(100% - 32px));margin:0 auto;padding:28px 0 42px}header{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end;margin-bottom:18px}h1{margin:0 0 8px;font-size:clamp(28px,5vw,44px);line-height:1.14}p{margin:0;color:var(--muted);line-height:1.7}.tag{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.72);color:var(--accent);font-weight:800;white-space:nowrap}.layout{display:grid;grid-template-columns:minmax(380px,.92fr) minmax(0,1.08fr);gap:16px;align-items:start}.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}.panel h2{margin:0;padding:16px 18px 0;font-size:20px}.controls{padding:16px 18px 18px;display:grid;gap:12px}.basic{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:grid;gap:6px;font-weight:800}.hint{color:var(--muted);font-size:13px;font-weight:400}input,select{width:100%;min-height:42px;border:1px solid #cbd6dc;border-radius:8px;padding:8px 10px;color:var(--text);font:inherit;background:#fff}input:focus,select:focus{outline:3px solid rgba(23,107,135,.18);border-color:var(--accent)}table{width:100%;border-collapse:collapse;overflow:hidden;border:1px solid var(--line);border-radius:8px;background:#fbfcfd}th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}th{color:var(--muted);font-size:13px;font-weight:800;background:#f6f8f9}td:first-child,th:first-child{width:54px;text-align:center}td:last-child,th:last-child{width:52px;text-align:center}.icon-btn{width:34px;min-height:34px;padding:0;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--bad);font-weight:900}.buttons{display:flex;flex-wrap:wrap;gap:10px}button{min-height:42px;border:1px solid transparent;border-radius:8px;padding:9px 14px;font:inherit;font-weight:800;cursor:pointer}.primary{color:#fff;background:var(--accent)}.secondary{color:var(--accent);background:#eef7fa;border-color:#c9e1ea}.drawing{padding:18px;display:grid;gap:12px}svg{width:100%;min-height:430px;border:1px solid var(--line);border-radius:8px;background:linear-gradient(#eef3f6 1px,transparent 1px),linear-gradient(90deg,#eef3f6 1px,transparent 1px),#fff;background-size:24px 24px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{padding:12px;border:1px solid var(--line);border-radius:8px;background:#fbfcfd}.metric span{display:block;color:var(--muted);font-size:13px;margin-bottom:4px}.metric strong{font-size:22px;line-height:1.1}.steps{margin-top:16px}.steps .panel{padding-bottom:18px}.steps table{width:calc(100% - 36px);margin:14px 18px 0}.ok{color:var(--accent2);font-weight:800}.warn{color:var(--warn);font-weight:800}.bad{color:var(--bad);font-weight:800}@media(max-width:940px){header,.layout,.basic,.summary{grid-template-columns:1fr}.tag{justify-self:start}svg{min-height:340px}}
</style>
</head>
<body><main>
<header><div><h1>折彎機圖形與步驟產生器</h1><p>左邊輸入每段長度與折角，右邊即時產生折彎形狀，下方列出折彎順序、左右邊長、短邊與風險提示。</p></div><div class="tag">Excel VBA 轉網頁作品</div></header>
<section class="layout"><div class="panel"><h2>輸入資料</h2><div class="controls"><div class="basic"><label>板厚 mm<span class="hint">用來估算 V 開口與最短折邊</span><input id="thickness" type="number" min="0.1" step="0.1" value="2"></label><label>板長 mm<span class="hint">留空或 0 時自動用段長總和</span><input id="plateLength" type="number" min="0" step="1" value="200"></label></div><table aria-label="折彎段資料"><thead><tr><th>段次</th><th>段長 mm</th><th>折角 °</th><th>折彎</th><th></th></tr></thead><tbody id="segmentRows"></tbody></table><div class="buttons"><button class="primary" type="button" id="drawBtn">產生圖形</button><button class="secondary" type="button" id="addRowBtn">新增段次</button><button class="secondary" type="button" id="sampleBtn">套用範例</button><button class="secondary" type="button" id="clearBtn">清除</button></div></div></div>
<div class="panel drawing"><div class="summary"><div class="metric"><span>總展開長</span><strong id="totalLength">0 mm</strong></div><div class="metric"><span>折彎數</span><strong id="bendCount">0</strong></div><div class="metric"><span>建議 V 開口</span><strong id="vOpen">0 mm</strong></div><div class="metric"><span>整體風險</span><strong id="riskText">-</strong></div></div><svg id="drawingSvg" viewBox="0 0 720 430" role="img" aria-label="折彎圖形"></svg></div></section>
<section class="steps"><div class="panel"><h2>折彎步驟</h2><table><thead><tr><th>折次</th><th>折角</th><th>左邊長</th><th>右邊長</th><th>短邊</th><th>建議</th><th>結果</th></tr></thead><tbody id="stepRows"></tbody></table></div></section>
</main>
<script>
const tbody=document.querySelector("#segmentRows"),stepRows=document.querySelector("#stepRows"),svg=document.querySelector("#drawingSvg"),thicknessInput=document.querySelector("#thickness"),plateLengthInput=document.querySelector("#plateLength");
const sampleSegments=[{length:30,angle:0,bend:false},{length:35,angle:90,bend:true},{length:45,angle:-90,bend:true},{length:30,angle:90,bend:true},{length:40,angle:0,bend:false}];
function normalizeAngle(a){let v=a%360;if(v<0)v+=360;return v}function readNumber(v){const n=Number(v);return Number.isFinite(n)?n:0}
function addRow(data={length:20,angle:0,bend:false}){const row=document.createElement("tr");row.innerHTML=`<td class="row-no"></td><td><input class="seg-length" type="number" min="0" step="1" value="${data.length}"></td><td><input class="seg-angle" type="number" step="1" value="${data.angle}"></td><td><select class="seg-bend"><option value="yes"${data.bend?" selected":""}>是</option><option value="no"${data.bend?"":" selected"}>否</option></select></td><td><button class="icon-btn" type="button" title="刪除">×</button></td>`;row.querySelector("button").addEventListener("click",()=>{row.remove();renumber();draw()});row.querySelectorAll("input,select").forEach(input=>input.addEventListener("input",draw));tbody.appendChild(row);renumber()}
function renumber(){[...tbody.querySelectorAll("tr")].forEach((row,i)=>row.querySelector(".row-no").textContent=i+1)}
function getSegments(){return[...tbody.querySelectorAll("tr")].map(row=>({length:Math.max(0,readNumber(row.querySelector(".seg-length").value)),angle:readNumber(row.querySelector(".seg-angle").value),bend:row.querySelector(".seg-bend").value==="yes"})).filter(s=>s.length>0)}
function appendRemainingLength(segments){const plateLength=readNumber(plateLengthInput.value),used=segments.reduce((sum,s)=>sum+s.length,0);if(plateLength>used)segments.push({length:plateLength-used,angle:0,bend:false,auto:true});return segments}
function computePoints(segments){let currentAngle=0,x=0,y=0;const points=[{x,y,angle:0}];segments.forEach((s,i)=>{if(i>0)currentAngle=normalizeAngle(currentAngle+s.angle);const rad=currentAngle*Math.PI/180;x+=s.length*Math.cos(rad);y+=s.length*Math.sin(rad);points.push({x,y,angle:currentAngle})});return points}
function scalePoints(points){const minX=Math.min(...points.map(p=>p.x)),maxX=Math.max(...points.map(p=>p.x)),minY=Math.min(...points.map(p=>p.y)),maxY=Math.max(...points.map(p=>p.y)),w=Math.max(1,maxX-minX),h=Math.max(1,maxY-minY),m=46,scale=Math.min((720-m*2)/w,(430-m*2)/h);return points.map(p=>({x:m+(p.x-minX)*scale,y:430-m-(p.y-minY)*scale}))}
function riskClass(shortEdge,minEdge){if(shortEdge<minEdge)return["高","bad"];if(shortEdge<minEdge*1.5)return["中","warn"];return["低","ok"]}
function draw(){const raw=getSegments(),segments=appendRemainingLength([...raw]),thickness=Math.max(0,readNumber(thicknessInput.value)),minEdge=Math.max(8,thickness*6),points=computePoints(segments),screen=scalePoints(points),bendIndexes=segments.map((segment,index)=>({segment,index})).filter(item=>item.index>0&&(item.segment.bend||item.segment.angle!==0)),totalLength=segments.reduce((sum,s)=>sum+s.length,0),risks=[];svg.innerHTML="";const path=document.createElementNS("http://www.w3.org/2000/svg","polyline");path.setAttribute("points",screen.map(p=>`${p.x},${p.y}`).join(" "));path.setAttribute("fill","none");path.setAttribute("stroke","#176b87");path.setAttribute("stroke-width","7");path.setAttribute("stroke-linecap","round");path.setAttribute("stroke-linejoin","round");svg.appendChild(path);screen.forEach((p,i)=>{const c=document.createElementNS("http://www.w3.org/2000/svg","circle");c.setAttribute("cx",p.x);c.setAttribute("cy",p.y);c.setAttribute("r",i===0||i===screen.length-1?6:5);c.setAttribute("fill",i===0?"#1f8a70":"#fff");c.setAttribute("stroke","#176b87");c.setAttribute("stroke-width","3");svg.appendChild(c)});segments.forEach((s,i)=>{if(i>=screen.length-1)return;const a=screen[i],b=screen[i+1],label=document.createElementNS("http://www.w3.org/2000/svg","text");label.setAttribute("x",(a.x+b.x)/2);label.setAttribute("y",(a.y+b.y)/2-10);label.setAttribute("text-anchor","middle");label.setAttribute("font-size","14");label.setAttribute("font-weight","700");label.setAttribute("fill","#172026");label.textContent=`${s.length}mm${s.auto?" 補長":""}`;svg.appendChild(label)});stepRows.innerHTML="";bendIndexes.forEach((item,bendNo)=>{const leftLen=segments[item.index-1]?.length||0,rightLen=segments[item.index]?.length||0,shortEdge=Math.min(leftLen,rightLen),[risk,cls]=riskClass(shortEdge,minEdge);risks.push(risk);const suggestion=item.segment.angle>0?"向上折":item.segment.angle<0?"向下折":"確認角度",row=document.createElement("tr");row.innerHTML=`<td>第 ${bendNo+1} 折</td><td>${item.segment.angle}°</td><td>${leftLen} mm</td><td>${rightLen} mm</td><td>${shortEdge} mm</td><td>${suggestion}</td><td class="${cls}">${risk==="高"?"短邊不足，需注意":risk==="中"?"可試作，需確認模具":"可製作"}</td>`;stepRows.appendChild(row);const p=screen[item.index],mark=document.createElementNS("http://www.w3.org/2000/svg","text");mark.setAttribute("x",p.x+10);mark.setAttribute("y",p.y-10);mark.setAttribute("font-size","14");mark.setAttribute("font-weight","900");mark.setAttribute("fill",cls==="bad"?"#b42318":cls==="warn"?"#a35d00":"#1f8a70");mark.textContent=`折${bendNo+1}`;svg.appendChild(mark)});if(bendIndexes.length===0)stepRows.innerHTML='<tr><td colspan="7">目前沒有折彎角度，請至少在第 2 段之後輸入折角。</td></tr>';document.querySelector("#totalLength").textContent=`${Math.round(totalLength*100)/100} mm`;document.querySelector("#bendCount").textContent=bendIndexes.length;document.querySelector("#vOpen").textContent=`${minEdge} mm`;const overall=risks.includes("高")?["高","bad"]:risks.includes("中")?["中","warn"]:["低","ok"];document.querySelector("#riskText").innerHTML=`<span class="${overall[1]}">${overall[0]}</span>`}
function loadSample(){tbody.innerHTML="";sampleSegments.forEach(addRow);plateLengthInput.value=200;thicknessInput.value=2;draw()}
document.querySelector("#drawBtn").addEventListener("click",draw);document.querySelector("#addRowBtn").addEventListener("click",()=>{addRow();draw()});document.querySelector("#sampleBtn").addEventListener("click",loadSample);document.querySelector("#clearBtn").addEventListener("click",()=>{tbody.innerHTML="";addRow({length:20,angle:0,bend:false});addRow({length:20,angle:90,bend:true});draw()});thicknessInput.addEventListener("input",draw);plateLengthInput.addEventListener("input",draw);loadSample();
</script></body></html>
